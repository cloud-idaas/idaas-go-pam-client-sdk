run:
  timeout: 5m
  go: '1.18'

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive

linters-settings:
  revive:
    rules:
      - name: var-naming
      - name: context-as-argument
      - name: exported
      - name: error-strings
      - name: error-naming

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
